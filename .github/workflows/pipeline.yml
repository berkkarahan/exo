name: ci-pipeline

on:
  push:
  pull_request:
    branches:
      - staging
      - main

jobs:
  nix:
    name: Build and check (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - uses: cachix/cachix-action@v14
        name: Configure Cachix
        with:
          name: exo
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Run pytest (Linux)
        run: |
          TEST_ENV=$(nix build '.#exo-test-env' --print-out-paths)
          export HOME="$RUNNER_TEMP"
          export EXO_TESTS=1
          export EXO_DASHBOARD_DIR="$PWD/dashboard/"
          export EXO_RESOURCES_DIR="$PWD/resources"
          # Linux MLX wheels are CUDA-only and not importable without a GPU;
          # MLX tests skip and the non-MLX suite still runs here.
          "$TEST_ENV/bin/python" -m pytest -q

      - name: Run live Rust networking test
        run: nix develop .#networking-test --command cargo test -p networking dynamic_listener_port_is_used_for_discovery -- --nocapture

      - name: Build all Nix outputs
        run: |
          nix flake show --json | jq -r '
            [
              (.packages."${{ matrix.system }}" // {} | keys[] | ".#packages.${{ matrix.system }}.\(.)"),
              (.devShells."${{ matrix.system }}" // {} | keys[] | ".#devShells.${{ matrix.system }}.\(.)")
            ] | .[]
          ' | xargs nix build

      - name: Run nix flake check
        run: nix flake check

  macos-tests:
    name: Run pytest (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run pytest
        run: uv run --extra mlx pytest -q
      - name: Run live Rust networking test
        run: cargo test -p networking dynamic_listener_port_is_used_for_discovery -- --nocapture

  windows-tests:
    name: Run pytest (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run pytest
        run: uv run pytest -q
      - name: Run live Rust networking test
        run: cargo test -p networking dynamic_listener_port_is_used_for_discovery -- --nocapture
